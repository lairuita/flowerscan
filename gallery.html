<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gallery — ikebana-inspired arrangements from flowerscan. Seasonal stems, Moribana and Nageire styles, Toronto.">
  <title>flowerscan — Gallery</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/flowerscan-icon-transparent.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============================================================
       Navigation
  ============================================================ -->
  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="nav__inner">
      <a href="index.html" class="nav__logo"><img src="assets/images/flowerscan-icon-white.svg" alt="" aria-hidden="true" class="nav__logo-icon">flowerscan</a>
      <ul class="nav__links" role="list">
        <li><a href="index.html" class="nav__link">Home</a></li>
        <li><a href="subscription.html" class="nav__link">Ikebana Box</a></li>
        <li><a href="workshops.html" class="nav__link">Workshops</a></li>
        <li><a href="gallery.html" class="nav__link nav__link--active">Gallery</a></li>
        <li><a href="about.html" class="nav__link">About</a></li>
      </ul>
    </div>
  </nav>


  <!-- ============================================================
       Hero — minimal
  ============================================================ -->
  <section class="hero hero--minimal" aria-labelledby="gallery-heading">
    <div class="container">
      <span class="label">Gallery</span>
      <h1 id="gallery-heading" style="margin-top: 1rem; margin-bottom: 0; max-width: 14ch;">
        The arrangements.
      </h1>
    </div>
  </section>

  <hr class="divider" style="margin: 0; border-top: 1px solid var(--color-border);">


  <!-- ============================================================
       Gallery Grid
  ============================================================ -->
  <section class="section section--sm" aria-label="Arrangement gallery">
    <div class="container">
      <div class="gallery-grid" role="list">

        <div class="gallery-grid__item" role="listitem">
          <img src="assets/images/M1.JPG" alt="Moribana arrangement">
          <div class="gallery-grid__caption">Moribana</div>
        </div>

        <div class="gallery-grid__item" role="listitem">
          <img src="assets/images/M2.JPG" alt="Moribana arrangement">
          <div class="gallery-grid__caption">Moribana</div>
        </div>

        <div class="gallery-grid__item" role="listitem">
          <img src="assets/images/M3.JPG" alt="Moribana arrangement">
          <div class="gallery-grid__caption">Moribana</div>
        </div>

        <div class="gallery-grid__item" role="listitem">
          <img src="assets/images/M4.JPG" alt="Moribana arrangement">
          <div class="gallery-grid__caption">Moribana</div>
        </div>

        <div class="gallery-grid__item" role="listitem">
          <img src="assets/images/M5.JPG" alt="Moribana arrangement">
          <div class="gallery-grid__caption">Moribana</div>
        </div>

        <div class="gallery-grid__item" role="listitem">
          <img src="assets/images/N1.JPG" alt="Nageire arrangement">
          <div class="gallery-grid__caption">Nageire</div>
        </div>

        <div class="gallery-grid__item" role="listitem">
          <img src="assets/images/N2.JPG" alt="Nageire arrangement">
          <div class="gallery-grid__caption">Nageire</div>
        </div>

        <div class="gallery-grid__item" role="listitem">
          <img src="assets/images/N3.JPG" alt="Nageire arrangement">
          <div class="gallery-grid__caption">Nageire</div>
        </div>

        <div class="gallery-grid__item" role="listitem">
          <img src="assets/images/N4.JPG" alt="Nageire arrangement">
          <div class="gallery-grid__caption">Nageire</div>
        </div>

        <div class="gallery-grid__item" role="listitem">
          <img src="assets/images/N5.JPG" alt="Nageire arrangement">
          <div class="gallery-grid__caption">Nageire</div>
        </div>

        <div class="gallery-grid__item" role="listitem">
          <img src="assets/images/N6.JPG" alt="Nageire arrangement">
          <div class="gallery-grid__caption">Nageire</div>
        </div>

      </div>
    </div>
  </section>


  <!-- ============================================================
       Footer
  ============================================================ -->
  <footer class="footer" role="contentinfo">
    <div class="footer__inner">
      <div class="footer__main">
        <div>
          <div class="footer__brand">flowerscan</div>
          <div class="footer__tagline">Toronto, ON</div>
        </div>
        <div class="footer__links">
          <a href="https://instagram.com/flower.scan" class="icon-link" aria-label="Instagram" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
              <circle cx="12" cy="12" r="4"/>
              <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
            </svg>
            flower.scan
          </a>
          <a href="mailto:flowerscan.ca@gmail.com" class="icon-link" aria-label="Email us">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <polyline points="2,4 12,13 22,4"/>
            </svg>
            flowerscan.ca@gmail.com
          </a>
        </div>
      </div>
      <div class="footer__bottom">&copy; 2025 flowerscan.ca</div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
